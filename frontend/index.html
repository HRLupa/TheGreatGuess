<!doctype html>
<html lang="fr" class="h-full bg-base-300">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Great Guess</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" href="./dist/style.css" />
    </head>
    <body class="h-full flex flex-col md:flex-row overflow-hidden bg-base-200 text-base-content">

        <!-- Barre latérale élargie (w-80 -> w-96) -->
        <aside class="w-full md:w-96 bg-base-100 border-r border-base-300 flex flex-col h-56 md:h-full p-5 shadow-md">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span>🎬</span> Vidéos disponibles (<span id="video_count">0</span>)
            </h2>
            <div id="video_list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Chargé dynamiquement -->
            </div>
        </aside>

        <!-- Zone Principale (Cartes et contrôles agrandis) -->
        <main class="flex-1 relative flex flex-col items-center justify-center p-6 md:p-10 overflow-y-auto">
            
            <!-- Badge Points plus grand -->
            <div class="absolute top-6 right-8 text-xl md:text-2xl font-black bg-base-100 border border-base-300 px-6 py-3 rounded-2xl shadow-md">
                <span id="points_display">Points : 0</span>
            </div>

            <!-- Pop-up d'incrément -->
            <div id="points_popup" class="fixed top-16 left-1/2 -translate-x-1/2 bg-success text-success-content text-lg font-bold px-8 py-3 rounded-full shadow-2xl opacity-0 transition-all duration-500 pointer-events-none z-50">
                +200 points!
            </div>

            <!-- Carte de Quiz agrandie (max-w-xl -> max-w-3xl) -->
            <div class="card w-full max-w-3xl bg-base-100 shadow-2xl p-8 md:p-12 my-auto space-y-8 border border-base-300/50">
                
                <div class="text-2xl md:text-3xl font-bold text-center italic text-primary min-h-[4rem] flex items-center justify-center leading-relaxed" id="phrase">
                    Chargement de la question...
                </div>

                <div class="relative space-y-4">
                    <input id="video_title" class="input input-bordered input-primary input-lg w-full text-lg shadow-sm" placeholder="Thème de la vidéo (titre)..." autocomplete="off" />
                    
                    <!-- Menu autocomplétion -->
                    <div id="suggestions" class="absolute z-20 w-full bg-base-100 shadow-2xl rounded-xl max-h-72 overflow-y-auto hidden border border-base-300 top-16"></div>

                    <input id="time_input" class="input input-bordered input-secondary input-lg w-full text-lg hidden shadow-sm" placeholder="Moment (HH::MM:SS)" autocomplete="off" inputmode="numeric" />
                    
                    <button id="button_title" onclick="submit_title()" class="btn btn-primary btn-lg w-full text-lg font-bold shadow-md">Valider le titre</button>
                    <button id="button_time" onclick="submit_time()" class="btn btn-secondary btn-lg w-full text-lg font-bold shadow-md hidden">Valider le temps</button>
                </div>

                <div id="result" class="text-center font-bold text-xl"></div>

                <div id="contexte" class="text-base italic text-base-content/80 text-center leading-relaxed"></div>

                <div id="video_player" class="flex justify-center hidden w-full"></div>

                <button id="suivant" onclick="new_question()" class="btn btn-accent btn-lg w-full text-lg font-bold shadow-md hidden">Question suivante</button>
            </div>

        </main>

        <script src="./main.js"></script>
    </body>
</html>
