<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration de Pandoru</title>
    <link rel="icon" type="image/x-icon" href="/TheGreatGuess/frontend/images/favicon.ico">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        #background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 0;
            pointer-events: none;
        }
        #video-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: transparent;
        }
    </style>
</head>

<body>
    <video id="background-video" autoplay muted loop playsinline>
        <source src="./animation_pandoru.mp4" type="video/mp4">
    </video>
    <div id="video_overlay"></div>
</body>
</html>
